<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Justin Patterson" />
    <meta
      name="description"
      content="A studyguide that contains various software engineering concepts, tehcniques, logic, and practices"
    />
    <meta
      name="keywords"
      content="software engineering, study aids, learning materials, flashcards, studyguide, Se Study-Station"
    />
    <title>Study-ler</title>
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="/" class="header__link">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="#" class="nav__link">My Decks</a></li>
          <li><a href="#" class="nav__link">About</a></li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content page__main-content_location_carousel">
      <section class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__row">
          <button
            type="button"
            aria-label="Go to previous card in the deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            disabled
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>

          <button
            type="button"
            class="carousel__btn carousel__btn_type_right"
            aria-label="Go to next card in the deck"
          ></button>
        </div>
        <button
          type="button"
          class="carousel__btn carousel__btn_type_flip"
          aria-label="This button flips the card around"
        ></button>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Justin Patterson</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
